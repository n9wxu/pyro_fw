name: Build

on:
  push:
    branches: [main, lua-all-boards]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PICO_SDK_VERSION: 2.2.0
  EMSDK_VERSION: 6.0.9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi \
            cppcheck clang-format pmccabe

      - name: Install Pico SDK
        run: |
          git clone --depth 1 --branch "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk.git /tmp/pico-sdk
          cd /tmp/pico-sdk && git submodule update --init lib/tinyusb lib/mbedtls lib/lwip lib/btstack lib/cyw43-driver

      - name: Build (default board, mk1b)
        run: |
          mkdir build && cd build
          cmake -G Ninja -DPICO_SDK_PATH=/tmp/pico-sdk ..
          ninja
        env:
          CI_BUILD: 1

      # Whatever is board-specific is checked only by building more than one
      # board. lua_tests runs on mk1c: its assertions are board-independent.
      - name: Build (mk1c)
        run: |
          mkdir build-mk1c && cd build-mk1c
          cmake -G Ninja -DPICO_SDK_PATH=/tmp/pico-sdk -DPYRO_BOARD=mk1c ..
          ninja
        env:
          CI_BUILD: 1

      - name: Build (mk1a)
        run: |
          mkdir build-mk1a && cd build-mk1a
          cmake -G Ninja -DPICO_SDK_PATH=/tmp/pico-sdk -DPYRO_BOARD=mk1a ..
          ninja
        env:
          CI_BUILD: 1

      - name: Build (mk1c_sd)
        run: |
          mkdir build-mk1c_sd && cd build-mk1c_sd
          cmake -G Ninja -DPICO_SDK_PATH=/tmp/pico-sdk -DPYRO_BOARD=mk1c_sd ..
          ninja
        env:
          CI_BUILD: 1

      # Every board declares PYRO_LOOP_WORST_MS; the reference template is what
      # a new board is copied from, so it has to keep building as shipped.
      - name: Build (reference template)
        run: |
          mkdir build-ref && cd build-ref
          cmake -G Ninja -DPICO_SDK_PATH=/tmp/pico-sdk -DPYRO_BOARD=reference ..
          ninja
        env:
          CI_BUILD: 1

      - name: Run unit tests
        run: cd build && ninja host_tests

      - name: Run Lua sandbox tests
        run: cd build-mk1c && ninja lua_tests

      # Standing guard on the core1 safety rule: core0 must never wait on
      # anything core1 can hold. See docs/core1_hazard.md -- the rule is a
      # property of the linked binary, not of the source, because the SDK
      # introduces the blocking waits underneath us.
      #
      # Every board with Lua: the linker and the inliner decide, per image,
      # whether an unbounded primitive is pulled in and whether a
      # __not_in_flash_func() keeps an out-of-line copy.
      - name: Prove the flight task cannot be hung
        run: |
          for elf in build/pyro_fw_*.elf build-mk1c/pyro_fw_*.elf build-mk1a/pyro_fw_*.elf build-mk1c_sd/pyro_fw_*.elf; do
            echo "--- $elf"
            python3 support/prove_core0.py --core1 lua_task "$elf"
          done

      # Informational: --error-exitcode=0, so findings are reported and never
      # fail the build.
      - name: Static analysis (cppcheck, informational)
        run: |
          cppcheck --enable=all --std=c11 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppressions-list=.cppcheck-suppress \
            --addon=misra \
            --error-exitcode=0 \
            --inline-suppr \
            -I src/ \
            src/flight_states.c src/telemetry_formatter.c src/buzzer.c src/hal.h \
            2>&1 | tee cppcheck-report.txt
          echo "=== Cppcheck summary ==="
          grep -c "error\|warning\|style\|performance\|portability" cppcheck-report.txt || echo "Clean"

      # A gate: an unformatted file, or a listed file that no longer exists,
      # fails the build.
      - name: Format check (clang-format)
        run: |
          clang-format --dry-run --Werror \
            src/flight_states.c src/telemetry_formatter.c src/buzzer.c \
            src/hal.h src/main_hardware.c \
            src/board_if.h src/board_id.h \
            src/hal_common/hal_common.c src/hal_common/board_defaults.c \
            src/board_support.h src/pressure_single_sensor.c src/bmp280_driver.c \
            boards/*/board_info.c boards/*/pyro_*.c boards/*/pyro_*.h boards/mk1b/pressure_board.c \
            boards/mk1c/arm_pump.c boards/mk1c/arm_pump.h \
            src/http_server.c src/http_server.h src/http_conn.c src/http_conn.h \
            src/http_work.c src/http_work.h src/status_json.c src/status_json.h \
            src/flight_log.c src/flight_log.h src/pressure_trace.c src/pressure_trace.h \
            src/log_plan.c src/log_plan.h \
            sim/physics.c sim/physics.h sim/replay.c sim/replay.h sim/pyro_sim.h \
            sim/sim_cli.c sim/main_sim.c test/test_physics.c test/test_replay.c

      - name: Cyclomatic complexity (pmccabe)
        run: |
          echo "=== Functions with complexity > 10 ==="
          pmccabe src/flight_states.c src/telemetry_formatter.c src/buzzer.c | sort -rn | head -20
          echo ""
          OVER=$(pmccabe src/flight_states.c src/telemetry_formatter.c src/buzzer.c | awk '$1 > 15 {print}')
          if [ -n "$OVER" ]; then
            echo "::error::Functions exceed complexity threshold of 15:"
            echo "$OVER"
            exit 1
          fi
          echo "All functions within complexity limit"

      # On every board: these compile against the selected board's board_pins.h,
      # which is exactly where a board-specific assumption hides.
      - name: Run integration tests
        run: |
          cd build && ninja integration_tests
          cd ../build-mk1c && ninja integration_tests
          cd ../build-mk1a && ninja integration_tests

      - name: Run closed-loop tests
        run: cd build && ninja closedloop_tests

      # The pressure chain under a real sensor's noise, booted as the hardware
      # boots: the only suite where the test HAL is not a perfect sensor.
      - name: Run pressure chain tests
        run: cd build && ninja pressure_chain_tests

      # Supersonic flights from a cold sea-level pad and a hot high one, with
      # static ports that misreport while the rocket is fast.
      - name: Run Mach lockout tests
        run: cd build && ninja mach_tests

      # Brownout recovery: a pure decision function, so every case that would
      # otherwise need a rocket and a loose battery connector runs here.
      - name: Run brownout recovery tests
        run: cd build && ninja brownout_tests

      # The HTTP engine against a byte stream: every request split at every
      # byte, and drained through a small window.
      - name: Run HTTP stream tests
        run: cd build && ninja http_tests

      # Who runs each HTTP work unit, and /api/status rendered from a
      # snapshot, linked alone (DD-061).
      - name: Run HTTP work unit and status rendering tests
        run: cd build && ninja http_work_tests && ninja status_json_tests && ninja net_stats_tests && ninja net_txq_tests && ninja mac_random_tests && ninja hr_log_tests && ninja flight_sim_tests

      # The simulators' rocket against USSA76, and flight logs read for replay.
      - name: Run physics and replay tests
        run: cd build && ninja physics_tests && ninja replay_tests

      # The flight log's binary records and their CSV (DD-062).
      - name: Run flight log format tests
        run: cd build && ninja flight_log_tests && ninja pressure_trace_tests && ninja log_plan_tests

      # The MS5607's interrupt state machine on a fake bus at each board's
      # own bus rate: the stamp is the handler's, through a held read and a
      # late loop, and each conversion is ready before the next loop.
      - name: Run MS5607 one-shot tests
        run: |
          cd build && ninja ms5607_tests
          cd ../build-mk1c && ninja ms5607_tests

      - name: Version rules
        run: |
          python3 support/version.py --selftest
          # VERSION must be the newest release, or one legal bump past it:
          # a minor bump that kept its patch number (2.3.7) is refused.
          git fetch -q --tags origin || true
          LAST=$(git tag -l 'v*' | sed 's/^v//' \
                 | awk -F. '$1~/^[0-9]+$/ && $2~/^[0-9]+$/ && $3~/^[0-9]+$/' \
                 | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          CUR=$(cat VERSION)
          if [ -z "$LAST" ]; then
            echo "no release tags yet; VERSION=$CUR"
          else
            echo "newest release v$LAST, VERSION $CUR"
            python3 support/version.py --check "$LAST" "$CUR"
          fi

      # The records against each other and the code (support/trace_check.py's
      # docstring lists the checks).
      - name: Traceability check
        run: |
          python3 support/trace_check.py --selftest
          python3 support/trace_check.py --counts

      # No sleeps: the exec loop is the only clock (DD-053). A ratchet over
      # the sites not yet converted, which only shrinks.
      - name: Wait check
        run: python3 support/wait_check.py

      # The bench's pressure judge, on made-up traces (DD-063).
      - name: Pressure trace analyzer self-test
        run: python3 support/pressure_trace.py --selftest

      # A board's pyro backend on the host, against a fake SDK whose sleeps
      # fail the test.
      - name: Run board pyro tests
        run: cd build && ninja board_pyro_tests

      # Every board's sensor bring-up as loop steps, against fake sensors.
      - name: Run sensor bring-up tests
        run: cd build && ninja sensor_bringup_tests && ninja bmp280_tests

      # The ground test procedure: its schedule and switch on a fake clock,
      # then through the flight software booted as the hardware boots (DD-071).
      - name: Run ground test tests
        run: cd build && ninja ground_test_seq_tests && ninja ground_test_tests

      - name: Run board self-test decision tests
        run: cd build && ninja board_selftest_tests

      - name: Run pin, beep, buzzer and config tests
        run: |
          cd build && ninja pin_caps_tests && ninja beep_tests && ninja beep_out_tests && ninja pin_assign_tests
          ninja buzzer_tests && ninja config_tests && ninja config_persistence_tests

      # The firing-network models, MK1C's held to the bench board (DD-054),
      # and MK1C's real pyro backend run against it (DD-055).
      - name: Run plant model and MK1C pyro backend tests
        run: cd build && ninja plant_tests && ninja board_pyro_mk1c_tests

      - name: Validate web JS syntax
        run: node --check www/app.js

      - name: Demo matches www
        run: scripts/sync_demo.sh --check

      - name: Install Playwright
        run: |
          cd test/web
          npm install
          npx playwright install --with-deps chromium

      - name: Web UI tests
        run: |
          cd test/web
          for MODE in new configured flown; do
            echo "=== Testing mode: $MODE ==="
            node mock_server.js $MODE 3456 &
            PID=$!
            sleep 2
            curl -s http://localhost:3456/api/status | head -c 100
            echo ""
            PYRO_MODE=$MODE BASE_URL=http://localhost:3456 npx playwright test --reporter=list 2>&1
            RESULT=$?
            kill $PID 2>/dev/null; wait $PID 2>/dev/null || true
            sleep 1
            if [ $RESULT -ne 0 ]; then exit $RESULT; fi
          done

      - name: Browser simulator
        run: |
          cd test/web
          node static_server.js ../../docs 3457 &
          PID=$!
          sleep 1
          SIM_URL=http://localhost:3457 npx playwright test test_sim.spec.js --reporter=list 2>&1
          RESULT=$?
          kill $PID 2>/dev/null; wait $PID 2>/dev/null || true
          exit $RESULT

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: |
            test/web/test-results/
            test/web/playwright-report/

      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build WASM simulation
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          cd /tmp/emsdk && ./emsdk install "$EMSDK_VERSION" && ./emsdk activate "$EMSDK_VERSION"
          source /tmp/emsdk/emsdk_env.sh
          cd $GITHUB_WORKSPACE && scripts/build_wasm.sh
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyro-mk1b-v${{ steps.ver.outputs.version }}
          path: |
            build/pyro_fw_mk1b.uf2
            build/pyro_fw_mk1b.bin
            build/pyro_fw_c_fota_image.bin
            build/_deps/pico_fota_bootloader-build/pico_fota_bootloader.uf2
            VERSION
            www/
            support/install.py
            support/upload_www.sh
            support/upload_fw.sh
            support/flash_picotool.sh
            support/update_from_release.py
            support/test_network.py
            support/README.md

  # Every green push to main is released as a patch. The bump is committed
  # with a skip-ci marker, and the release workflow is called rather than
  # triggered by the tag: a tag pushed with GITHUB_TOKEN starts no workflow.
  # The marker is spelled only in the step below, never in prose: GitHub
  # matches it anywhere in a commit message.
  patch-release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: patch-release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Bump the patch version
        id: bump
        run: |
          set -e
          CUR=$(python3 support/version.py --current)
          NEW=$(python3 support/version.py --next patch)
          if git rev-parse -q --verify "refs/tags/v$NEW" >/dev/null; then
            echo "::error::tag v$NEW already exists; VERSION is behind the tags"
            exit 1
          fi
          python3 support/version.py --set "$NEW"
          echo "$CUR -> $NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"

  release:
    needs: patch-release
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.patch-release.outputs.version }}
