name: Build

on:
  push:
    branches: [main, lua-all-boards, freertos-sd]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PICO_SDK_VERSION: 2.2.0
  EMSDK_VERSION: 6.0.9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi \
            cppcheck clang-format pmccabe

      - name: Install Pico SDK
        run: |
          git clone --depth 1 --branch "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk.git /tmp/pico-sdk
          cd /tmp/pico-sdk && git submodule update --init lib/tinyusb lib/mbedtls lib/lwip lib/btstack lib/cyw43-driver

      - name: Build (default board, mk1b)
        run: |
          mkdir build && cd build
          cmake -G Ninja -DPICO_SDK_PATH=/tmp/pico-sdk ..
          ninja
        env:
          CI_BUILD: 1

      # Whatever is board-specific is checked only by building more than one
      # board. lua_tests runs on mk1c: its assertions are board-independent.
      - name: Build (mk1c)
        run: |
          mkdir build-mk1c && cd build-mk1c
          cmake -G Ninja -DPICO_SDK_PATH=/tmp/pico-sdk -DPYRO_BOARD=mk1c ..
          ninja
        env:
          CI_BUILD: 1

      - name: Build (mk1a)
        run: |
          mkdir build-mk1a && cd build-mk1a
          cmake -G Ninja -DPICO_SDK_PATH=/tmp/pico-sdk -DPYRO_BOARD=mk1a ..
          ninja
        env:
          CI_BUILD: 1

      - name: Build (mk1c_sd)
        run: |
          mkdir build-mk1c_sd && cd build-mk1c_sd
          cmake -G Ninja -DPICO_SDK_PATH=/tmp/pico-sdk -DPYRO_BOARD=mk1c_sd ..
          ninja
        env:
          CI_BUILD: 1

      # Every board declares PYRO_LOOP_WORST_MS; the reference template is what
      # a new board is copied from, so it has to keep building as shipped.
      - name: Build (reference template)
        run: |
          mkdir build-ref && cd build-ref
          cmake -G Ninja -DPICO_SDK_PATH=/tmp/pico-sdk -DPYRO_BOARD=reference ..
          ninja
        env:
          CI_BUILD: 1

      # Every host suite, from the one list the local gate runs: the flight
      # software through the mocked HAL, each module on its own, the boards'
      # pyro backends against their plants, and the records against the code
      # (trace_check, trace_matrix, structure_check, wait_check).
      - name: Run host tests
        run: scripts/run_host_tests.sh
        env:
          CI_BUILD: 1

      # Standing guard on the core1 safety rule: core0 must never wait on
      # anything core1 can hold. See docs/core1_hazard.md -- the rule is a
      # property of the linked binary, not of the source, because the SDK
      # introduces the blocking waits underneath us.
      #
      # Every board with Lua: the linker and the inliner decide, per image,
      # whether an unbounded primitive is pulled in and whether a
      # __not_in_flash_func() keeps an out-of-line copy.
      - name: Prove the flight task cannot be hung
        run: |
          for elf in build/pyro_fw_*.elf build-mk1c/pyro_fw_*.elf build-mk1a/pyro_fw_*.elf build-mk1c_sd/pyro_fw_*.elf; do
            echo "--- $elf"
            python3 support/prove_core0.py --core1 lua_task "$elf"
          done

      # Informational: --error-exitcode=0 reports findings and never fails
      # the build.
      - name: Static analysis (cppcheck, informational)
        run: |
          cppcheck --enable=all --std=c11 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppressions-list=.cppcheck-suppress \
            --addon=misra \
            --error-exitcode=0 \
            --inline-suppr \
            -I src/ \
            $(cat src/flight_sources.txt) src/buzzer.c src/hal.h \
            2>&1 | tee cppcheck-report.txt
          echo "=== Cppcheck summary ==="
          grep -c "error\|warning\|style\|performance\|portability" cppcheck-report.txt || echo "Clean"

      # A gate: an unformatted file, or a listed file that no longer exists,
      # fails the build.
      - name: Format check (clang-format)
        run: scripts/format_check.sh

      - name: Cyclomatic complexity (pmccabe)
        run: |
          echo "=== Functions with complexity > 10 ==="
          pmccabe $(cat src/flight_sources.txt) src/buzzer.c | sort -rn | head -20
          echo ""
          OVER=$(pmccabe $(cat src/flight_sources.txt) src/buzzer.c | awk '$1 > 15 {print}')
          if [ -n "$OVER" ]; then
            echo "::error::Functions exceed complexity threshold of 15:"
            echo "$OVER"
            exit 1
          fi
          echo "All functions within complexity limit"

      - name: Version rules
        run: |
          python3 support/version.py --selftest
          # VERSION must be the newest release, or one legal bump past it:
          # a minor bump that kept its patch number (2.3.7) is refused.
          git fetch -q --tags origin || true
          LAST=$(git tag -l 'v*' | sed 's/^v//' \
                 | awk -F. '$1~/^[0-9]+$/ && $2~/^[0-9]+$/ && $3~/^[0-9]+$/' \
                 | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          CUR=$(cat VERSION)
          if [ -z "$LAST" ]; then
            echo "no release tags yet; VERSION=$CUR"
          else
            echo "newest release v$LAST, VERSION $CUR"
            python3 support/version.py --check "$LAST" "$CUR"
          fi

      # The bench's pressure judge, on made-up traces (DD-063).
      - name: Pressure trace analyzer self-test
        run: python3 support/pressure_trace.py --selftest

      - name: Validate web JS syntax
        run: node --check www/app.js

      - name: Demo matches www
        run: scripts/sync_demo.sh --check

      - name: Install Playwright
        run: |
          cd test/web
          npm install
          npx playwright install --with-deps chromium

      - name: Web UI tests
        run: |
          cd test/web
          for MODE in new configured flown; do
            echo "=== Testing mode: $MODE ==="
            node mock_server.js $MODE 3456 &
            PID=$!
            sleep 2
            curl -s http://localhost:3456/api/status | head -c 100
            echo ""
            PYRO_MODE=$MODE BASE_URL=http://localhost:3456 npx playwright test --reporter=list 2>&1
            RESULT=$?
            kill $PID 2>/dev/null; wait $PID 2>/dev/null || true
            sleep 1
            if [ $RESULT -ne 0 ]; then exit $RESULT; fi
          done

      - name: Browser simulator
        run: |
          cd test/web
          node static_server.js ../../docs 3457 &
          PID=$!
          sleep 1
          SIM_URL=http://localhost:3457 npx playwright test test_sim.spec.js --reporter=list 2>&1
          RESULT=$?
          kill $PID 2>/dev/null; wait $PID 2>/dev/null || true
          exit $RESULT

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: |
            test/web/test-results/
            test/web/playwright-report/

      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build WASM simulation
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          cd /tmp/emsdk && ./emsdk install "$EMSDK_VERSION" && ./emsdk activate "$EMSDK_VERSION"
          source /tmp/emsdk/emsdk_env.sh
          cd "$GITHUB_WORKSPACE" && scripts/build_wasm.sh
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyro-mk1b-v${{ steps.ver.outputs.version }}
          path: |
            build/pyro_fw_mk1b.uf2
            build/pyro_fw_mk1b.bin
            build/pyro_fw_c_fota_image.bin
            build/_deps/pico_fota_bootloader-build/pico_fota_bootloader.uf2
            VERSION
            www/
            support/install.py
            support/upload_www.sh
            support/upload_fw.sh
            support/flash_picotool.sh
            support/update_from_release.py
            support/test_network.py
            support/README.md

  # Every green push to main is released as a patch. The bump is committed
  # with a skip-ci marker, and the release workflow is called rather than
  # triggered by the tag: a tag pushed with GITHUB_TOKEN starts no workflow.
  # The marker is spelled only in the step below, never in prose: GitHub
  # matches it anywhere in a commit message.
  patch-release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: patch-release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Bump the patch version
        id: bump
        run: |
          set -e
          CUR=$(python3 support/version.py --current)
          NEW=$(python3 support/version.py --next patch)
          if git rev-parse -q --verify "refs/tags/v$NEW" >/dev/null; then
            echo "::error::tag v$NEW already exists; VERSION is behind the tags"
            exit 1
          fi
          python3 support/version.py --set "$NEW"
          echo "$CUR -> $NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"

  release:
    needs: patch-release
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.patch-release.outputs.version }}
