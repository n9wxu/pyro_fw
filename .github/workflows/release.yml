name: Release

on:
  # A deliberate major or minor release: scripts/bump_version.sh pushes the
  # tag and this runs from it.
  push:
    tags: ['v*']
  # The automatic patch release, called by Build once main is green. It is
  # the same job either way, so there is one definition of what a release
  # is rather than two that drift.
  workflow_call:
    inputs:
      version:
        description: The version to release, without the leading v
        required: true
        type: string

env:
  PICO_SDK_VERSION: 2.2.0
  # Every board a release ships binaries for.
  #
  # reference/ is a porting template and builds nothing anyone flashes, and
  # mk1c_sd is not in the supported set yet, so neither is listed. Adding a
  # board here is all it takes -- the steps below loop over this list and
  # name every artifact after the board it came from.
  PYRO_RELEASE_BOARDS: mk1a mk1b mk1c

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Install Pico SDK
        run: |
          git clone --depth 1 --branch "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk.git /tmp/pico-sdk
          cd /tmp/pico-sdk && git submodule update --init lib/tinyusb lib/mbedtls lib/lwip lib/btstack lib/cyw43-driver

      - name: Settle the version
        id: ver
        env:
          CALLED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$CALLED_VERSION" ]; then
            V="$CALLED_VERSION"          # called by Build
          else
            V="${GITHUB_REF_NAME#v}"           # run from a pushed tag
          fi
          # A release is the last chance to catch a version that is not one.
          python3 support/version.py --validate "$V" >/dev/null
          echo "$V" > VERSION
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "releasing $V"

      - name: Build every supported board
        env:
          CI_BUILD: 1
        run: |
          set -e
          mkdir -p dist
          for BOARD in $PYRO_RELEASE_BOARDS; do
            echo "::group::$BOARD"
            cmake -G Ninja -B "build-$BOARD" -DPICO_SDK_PATH=/tmp/pico-sdk -DPYRO_BOARD="$BOARD"
            cmake --build "build-$BOARD"

            # Two of the three artifacts have the same filename whatever
            # board produced them, and the bootloader's CONTENTS differ per
            # board because the flash geometry does -- mk1b is a 2 MB part,
            # mk1a and mk1c are 16 MB. Publishing them unrenamed would have
            # each board's upload overwrite the last and leave one set of
            # binaries labelled as if it fitted all three.
            # pyro_fw_$BOARD.bin and pyro_fw_c_fota_image.bin are
            # byte-identical, so only the OTA-named one is shipped.
            cp "build-$BOARD/pyro_fw_$BOARD.uf2"       "dist/fw_$BOARD.uf2"
            cp "build-$BOARD/pyro_fw_c_fota_image.bin" "dist/fw_${BOARD}_fota.bin"
            cp "build-$BOARD/_deps/pico_fota_bootloader-build/pico_fota_bootloader.uf2" \
               "dist/fw_${BOARD}_bootloader.uf2"
            echo "::endgroup::"
          done
          echo "=== release payload ==="
          ls -l dist

      - name: Refuse to release a board that built nothing
        run: |
          set -e
          for BOARD in $PYRO_RELEASE_BOARDS; do
            for f in "fw_$BOARD.uf2" "fw_${BOARD}_fota.bin" \
                     "fw_${BOARD}_bootloader.uf2"; do
              [ -s "dist/$f" ] || { echo "::error::missing or empty dist/$f"; exit 1; }
            done
          done
          # The bootloaders must differ between a 2 MB board and a 16 MB one.
          # If they match, a board was built against the wrong flash geometry
          # and the artifacts would be silently wrong rather than absent.
          if cmp -s dist/fw_mk1b_bootloader.uf2 dist/fw_mk1c_bootloader.uf2; then
            echo "::error::mk1b and mk1c bootloaders are identical -- flash geometry did not take"
            exit 1
          fi
          echo "all boards present and distinct"

      - name: Package support tools and web files
        run: zip -r dist/pyro-support.zip www/ support/ VERSION

      # Every firmware asset is fw_<board>[_fota|_bootloader].<ext>, so the
      # board is always in the name and a consumer picks by board rather
      # than by guessing which of several unlabelled files is theirs.

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.version, 'beta') || contains(steps.ver.outputs.version, 'rc') }}
          files: dist/*
